name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (Java 21 + Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run server unit tests
        working-directory: server
        run: mvn -B test

  desktop-core:
    name: desktop TodoCore (C++ + CMake)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release
      - name: Build core tests
        run: cmake --build desktop/build --config Release --target test_repository test_json test_syncengine
      - name: Run ctest
        working-directory: desktop/build
        run: ctest -C Release --output-on-failure

  mobile:
    name: mobile (Kotlin + AGP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Unit tests + assemble APK
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug